<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路線バスモニター - M-san Lab</title>
    <link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="timetable.js"></script>
  </head>
  <body>
    <header>
      <a class="back-to-home" href="/">M-san Lab</a>
    </header>
    <main>
      <p>使いかたは<a href="how-to-use.html">こちら</a></p>
      <p>免責事項・プライバシーポリシーは<a href="about.html">こちら</a></p>
      <div class="NextBusesListSection">
        <h1 class="title">時刻表</h1>
          <select id="stopName">
            <option value="ichi">市立大学前</option>
            <option value="numa">沼田料金所前</option>
          </select>
        <div id="timetable">
          <table>
            <thead>
              <tr class="header-row">
                <td class="hour">時</td>
                <td class="minutes">分</td>
              </tr>
            </thead>
            <tbody id="timetable_data"></tbody>
          </table>
        </div>
        <div id="data"></div>
        <h2>凡例</h2>
        <h3>経由地・行先</h3>
        <table class="sample">
          <tr>
            <td>大</td>
            <td>市立大学前</td>
            <td>く</td>
            <td>くすの木台</td>
          </tr>
          <tr>
            <td>セ</td>
            <td>広島バスセンター</td>
            <td>あ</td>
            <td>あさひが丘下</td>
          </tr>
          <tr>
            <td>横</td>
            <td>横川駅前</td>
            <td>南</td>
            <td>こころ南中央</td>
          </tr>
          <tr>
            <td>中</td>
            <td>中広町</td>
            <td>産</td>
            <td>こころ産業団地</td>
          </tr>
          <tr>
            <td>役</td>
            <td>市役所前</td>
            <td>梅</td>
            <td>こころ西風梅苑</td>
          </tr>
          <tr>
            <td>ジ</td>
            <td>ジアウトレット広島</td>
            <td>花</td>
            <td>花の季台</td>
          </tr>
          <tr>
            <td>ア</td>
            <td>アルパーク</td>
            <td>そ</td>
            <td>そらの北</td>
          </tr>
          <tr>
            <td>五</td>
            <td>五日市駅北口</td>
            <td>免</td>
            <td>免許センター</td>
          </tr>
          <tr>
            <td>紙</td>
            <td>紙屋町</td>
            <td>修</td>
            <td>広島修道大学キャンパス</td>
          </tr>
          <tr>
            <td>港</td>
            <td>広島港桟橋</td>
            <td>藤</td>
            <td>藤の木団地</td>
          </tr>
        </table>
      </div>
    </main>
    <!-- ボトムシートの要素 -->
    <div id="overlay" class="overlay"></div>
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle"></div>
      <button id="close-btn" class="close-btn">閉じる</button>
      <div class="sheet-content" id="sheet-content">
        <div class="bus-info">
          <p id="sheet-route-long-name"></p>
          <!-- <p id="sheet-via-stop"></p> -->
          <div class="BusRouteAndDest" id="BusRouteAndDest">
            <p
              class="sheet-route-short-name BusNum"
              id="sheet-route-short-name"
            ></p>
            <p class="sheet-destination-stop" id="sheet-destination-stop"></p>
          </div>
          <!-- <p id="sheet-source-stop"></p> -->
        </div>
        <hr />
        <div id="sheet-table" class="sheet-table"></div>
      </div>
    </div>
  </body>
  <footer>
    <p>&copy; 2026 M-san Lab. All rights reserved.</p>

      <a href="https://x.com/tkmei_M">Twitter</a>
    </p>
    <p>
      <a href="https://note.com/tkmei_m">note</a>
    </p>
    <p><a href="/">TOPに戻る</a></p>
  </footer>
</html>
