    <link href="http://fonts.googleapis.com/earlyaccess/notosansjp.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <body>
    <header>
      <a class="back-to-home" href="/">M-san Lab</a>
    </header>
    <main>
      <p>使いかたは<a href="how-to-use.html">こちら</a></p>
      <p>免責事項・プライバシーポリシーは<a href="about.html">こちら</a></p>
      <div class="NextBusesListSection">
        <h1 class="title">路線バスモニター</h1>
        <div class="NextBusesListsGroup">
          <div class="NextBusList univ">
            <p class="StopName">市立大学前</p>
            <div id="BusesCell_univ"></div>
          </div>
          <div class="NextBusList numa">
            <p class="StopName">沼田料金所前</p>
            <div id="BusesCell_numa"></div>
          </div>
        </div>
        <div id="data"></div>
      </div>
    </main>
    <!-- ボトムシートの要素 -->
    <div id="overlay" class="overlay"></div>
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle"></div>
      <button id="close-btn" class="close-btn">閉じる</button>
      <div class="sheet-content" id="sheet-content">
        <div class="bus-info">
          <p id="sheet-route-long-name"></p>
          <!-- <p id="sheet-via-stop"></p> -->
          <div class="BusRouteAndDest" id="BusRouteAndDest">
            <p
              class="sheet-route-short-name BusNum"
              id="sheet-route-short-name"
            ></p>
            <p class="sheet-destination-stop" id="sheet-destination-stop"></p>
          </div>
          <!-- <p id="sheet-source-stop"></p> -->
        </div>
        <hr />
        <div id="sheet-table" class="sheet-table"></div>
      </div>
    </div>
  </body>
